services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: debby-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3001
      - DATA_DIR=/app/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - debby-data:/app/data
    restart: unless-stopped
    networks:
      - debby-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: debby-web
    ports:
      - "3001:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - debby-network

  # Example PostgreSQL database
  example-postgres:
    image: postgres:16-alpine
    container_name: debby-example-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - debby-network
    profiles:
      - example

volumes:
  debby-data:
    driver: local
  postgres-data:
    driver: local

networks:
  debby-network:
    driver: bridge
